# FILE:      .github/workflows/release.yml
# CREATED:   2026-11-07 17:09 +03
# TASK:      release-zips-ci (manager #1060 q1: a release must not need the maintainer laptop)
# AUTHOR:    M Alhassoun
# WHAT:      On a v* tag, builds local_kwtsms-<tag>.zip (root folder kwtsms/, the layout Moodle's plugin installer and
#            the plugins directory expect) from local/kwtsms and attaches it to the GitHub release of that tag, creating
#            the release if needed. Pull requests only build it. Release notes are written by hand (high level).
# WHY:       The zip used to be built on the laptop. Verified: the same command on the v1.0.3 tree gives the same
#            entries as the published local_kwtsms-v1.0.3.zip.
# USAGE:     git push origin vX.Y.Z (after the approval card).
# DEPENDS:   GITHUB_TOKEN with contents: write.
name: Release zip

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugin zip
        env:
          NAME: local_kwtsms-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'pr' }}.zip
        run: |
          cd local && zip -qr "$GITHUB_WORKSPACE/$NAME" kwtsms
          cd "$GITHUB_WORKSPACE" && unzip -l "$NAME" | tail -1
          unzip -Z1 "$NAME" | grep -E '^kwtsms/version\.php$'
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "$NAME" --clobber || gh release create "$TAG" --title "$TAG" --notes "Release $TAG" "$NAME"
